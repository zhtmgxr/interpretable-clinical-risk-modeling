name: R tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4.1"

      - name: Parse source files
        run: Rscript -e 'invisible(lapply(list.files("R", full.names = TRUE, pattern = "[.]R$"), function(path) parse(file = path)))'

      - name: Run tests
        run: Rscript tests/run_tests.R
